include: package:solid_lints/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**


plugins:
  solid_lints: 1.0.0

solid_lints:
  diagnostics:
    named_parameters_ordering:
      order:
        - required
        - required_super
        - default
        - nullable
        - super
